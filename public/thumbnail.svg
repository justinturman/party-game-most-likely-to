<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#1e1e2f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="320" height="180" fill="url(#bg)"/>

  <!-- Speech bubble with "?" -->
  <g filter="url(#shadow)">
    <path d="M70 55 Q70 30 95 30 H225 Q250 30 250 55 V100 Q250 125 225 125 H160 L130 155 L135 125 H95 Q70 125 70 100 Z"
          fill="#ffffff"/>
  </g>
  <text x="160" y="98" font-family="sans-serif" font-size="52" font-weight="bold"
        fill="#c2410c" text-anchor="middle">?</text>

  <!-- Three little player avatars at bottom -->
  <g filter="url(#shadow)">
    <circle cx="70" cy="152" r="14" fill="#ff8a50"/>
    <circle cx="160" cy="152" r="14" fill="#ffccbc"/>
    <circle cx="250" cy="152" r="14" fill="#ff8a50"/>
  </g>
  <text x="70" y="158" font-family="sans-serif" font-size="14" font-weight="bold"
        fill="#1e1e2f" text-anchor="middle">A</text>
  <text x="160" y="158" font-family="sans-serif" font-size="14" font-weight="bold"
        fill="#c2410c" text-anchor="middle">B</text>
  <text x="250" y="158" font-family="sans-serif" font-size="14" font-weight="bold"
        fill="#1e1e2f" text-anchor="middle">C</text>
</svg>